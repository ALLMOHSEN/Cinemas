<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almohsen</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html, body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}
/* مساحة التمرير */
.scroll-area {
    height: 700vh;
}
/* الشاشة */
.sticky {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #000;
}
/* Canvas */
#canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
/* طبقة فوق الفيديو */
.overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.05),
        rgba(0,0,0,0.65)
    );
    pointer-events: none;
}
/* الاسم */
.intro {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: opacity 0.5s ease;
    pointer-events: none;
}
.intro h1 {
    font-size: clamp(45px, 10vw, 110px);
    letter-spacing: 2px;
    text-shadow: 0 5px 30px rgba(0,0,0,0.8);
}
.intro p {
    margin-top: 15px;
    font-size: 17px;
    opacity: 0.8;
}
/* الحسابات */
.socials {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}
/* أزرار الحسابات */
.social {
    color: white;
    text-decoration: none;
    padding: 13px 20px;
    border-radius: 50px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    opacity: 0;
    transform: translateY(30px) scale(0.9);
    transition:
        opacity 0.5s ease,
        transform 0.5s ease,
        background 0.3s ease;
}
.social.show {
    opacity: 1;
    transform:
        translateY(0)
        scale(1);
}
.social:hover {
    background: rgba(255,255,255,0.2);
}
/* سهم */
.scroll-hint {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    opacity: 0.8;
    animation: bounce 1.5s infinite;
    transition: opacity 0.4s ease;
}
@keyframes bounce {
    0%, 100% {
        transform:
            translateX(-50%)
            translateY(0);
    }
    50% {
        transform:
            translateX(-50%)
            translateY(-8px);
    }
}
/* التحميل */
.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-size: 15px;
    z-index: 20;
}
/* الهاتف */
@media (max-width: 600px) {
    .socials {
        bottom: 6%;
        gap: 8px;
    }
    .social {
        padding: 10px 14px;
        font-size: 13px;
    }
}
</style>
</head>
<body>
<!--
====================================================
VIDEO
====================================================
ضع 12.mp4 بجانب index.html
مثال:
index.html
12.mp4
-->
<video
    id="video"
    src="12.mp4"
    preload="auto"
    muted
    playsinline
    webkit-playsinline
    style="display:none;">
</video>
<!-- مساحة التمرير -->
<section class="scroll-area">
    <div class="sticky">
        <!-- الفيديو يظهر هنا -->
        <canvas id="canvas"></canvas>
        <div class="overlay"></div>
        <!-- الاسم -->
        <div
            class="intro"
            id="intro">
            <div>
                <h1>Almohsen</h1>
                <p>
                    Scroll to explore
                </p>
            </div>
        </div>
        <!-- الحسابات -->
        <div class="socials">
            <!-- Instagram -->
            <a
                class="social"
                data-start="0.25"
                href="https://instagram.com/YOUR_USERNAME"
                target="_blank"
                rel="noopener">
                Instagram
                ·
                @YOUR_USERNAME
            </a>
            <!-- TikTok -->
            <a
                class="social"
                data-start="0.40"
                href="https://tiktok.com/@YOUR_USERNAME"
                target="_blank"
                rel="noopener">
                TikTok
                ·
                @YOUR_USERNAME
            </a>
            <!-- Facebook -->
            <a
                class="social"
                data-start="0.55"
                href="https://facebook.com/YOUR_USERNAME"
                target="_blank"
                rel="noopener">
                Facebook
                ·
                YOUR_USERNAME
            </a>
            <!-- YouTube -->
            <a
                class="social"
                data-start="0.70"
                href="https://youtube.com/@YOUR_USERNAME"
                target="_blank"
                rel="noopener">
                YouTube
                ·
                @YOUR_USERNAME
            </a>
        </div>
        <!-- Scroll -->
        <div
            class="scroll-hint"
            id="scrollHint">
            ↓ Scroll ↓
        </div>
        <!-- Loading -->
        <div
            class="loading"
            id="loading">
            Loading video...
        </div>
    </div>
</section>
<script>
/*
====================================================
ELEMENTS
====================================================
*/
const video =
    document.getElementById("video");
const canvas =
    document.getElementById("canvas");
const ctx =
    canvas.getContext("2d");
const scrollArea =
    document.querySelector(".scroll-area");
const intro =
    document.getElementById("intro");
const scrollHint =
    document.getElementById("scrollHint");
const loading =
    document.getElementById("loading");
const socials =
    document.querySelectorAll(".social");
/*
====================================================
VARIABLES
====================================================
*/
let videoReady = false;
let duration = 0;
let lastTime = -1;
let ticking = false;
/*
====================================================
CANVAS SIZE
====================================================
*/
function resizeCanvas() {
    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );
    canvas.width =
        Math.floor(
            window.innerWidth * dpr
        );
    canvas.height =
        Math.floor(
            window.innerHeight * dpr
        );
    canvas.style.width =
        window.innerWidth + "px";
    canvas.style.height =
        window.innerHeight + "px";
    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
    drawFrame();
}
/*
====================================================
DRAW VIDEO FRAME
====================================================
*/
function drawFrame() {
    if (
        !videoReady ||
        video.videoWidth === 0
    ) {
        return;
    }
    const cw =
        window.innerWidth;
    const ch =
        window.innerHeight;
    const vw =
        video.videoWidth;
    const vh =
        video.videoHeight;
    /*
    Cover
    */
    const scale =
        Math.max(
            cw / vw,
            ch / vh
        );
    const width =
        vw * scale;
    const height =
        vh * scale;
    const x =
        (cw - width) / 2;
    const y =
        (ch - height) / 2;
    ctx.clearRect(
        0,
        0,
        cw,
        ch
    );
    ctx.drawImage(
        video,
        x,
        y,
        width,
        height
    );
}
/*
====================================================
VIDEO LOADED
====================================================
*/
function videoLoaded() {
    if (videoReady)
        return;
    if (!video.duration)
        return;
    duration =
        video.duration;
    videoReady =
        true;
    loading.style.display =
        "none";
    resizeCanvas();
    updateScroll();
}
/*
====================================================
VIDEO EVENTS
====================================================
*/
video.addEventListener(
    "loadedmetadata",
    videoLoaded
);
video.addEventListener(
    "loadeddata",
    videoLoaded
);
video.addEventListener(
    "canplay",
    videoLoaded
);
video.addEventListener(
    "seeked",
    drawFrame
);
/*
====================================================
SCROLL
====================================================
*/
function updateScroll() {
    ticking = false;
    if (
        !videoReady ||
        duration <= 0
    ) {
        return;
    }
    const rect =
        scrollArea.getBoundingClientRect();
    const total =
        scrollArea.offsetHeight -
        window.innerHeight;
    let progress =
        -rect.top / total;
    /*
    0 → 1
    */
    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );
    /*
    تحويل Scroll
    إلى وقت الفيديو
    */
    const targetTime =
        progress * duration;
    /*
    منع التحديثات الصغيرة جداً
    */
    if (
        Math.abs(
            targetTime - lastTime
        ) > 0.015
    ) {
        lastTime =
            targetTime;
        try {
            video.currentTime =
                targetTime;
        } catch (error) {
            console.log(error);
        }
    }
    /*
    الاسم
    */
    if (progress > 0.15) {
        intro.style.opacity =
            "0";
    } else {
        intro.style.opacity =
            String(
                1 - progress / 0.15
            );
    }
    /*
    السهم
    */
    if (progress > 0.08) {
        scrollHint.style.opacity =
            "0";
    } else {
        scrollHint.style.opacity =
            "0.8";
    }
    /*
    Social Media
    */
    socials.forEach(
        function(item) {
            const start =
                parseFloat(
                    item.dataset.start
                );
            if (progress >= start) {
                item.classList.add(
                    "show"
                );
            } else {
                item.classList.remove(
                    "show"
                );
            }
        }
    );
}
/*
====================================================
SCROLL EVENT
====================================================
*/
window.addEventListener(
    "scroll",
    function() {
        if (!ticking) {
            requestAnimationFrame(
                updateScroll
            );
            ticking = true;
        }
    },
    {
        passive: true
    }
);
/*
====================================================
RESIZE
====================================================
*/
window.addEventListener(
    "resize",
    resizeCanvas
);
/*
====================================================
VIDEO ERROR
====================================================
*/
video.addEventListener(
    "error",
    function() {
        loading.innerHTML =
            "Video 12.mp4 was not found.<br>" +
            "Make sure it is next to index.html.";
    }
);
/*
====================================================
START
====================================================
*/
video.load();
</script>
</body>
</html>
