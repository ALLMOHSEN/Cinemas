<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>ALMOHSEN // EXPERIENCE</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{

    width:100%;
    min-height:100%;

    background:#000;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x:hidden;
}


/* =====================================================
   SCROLL AREA
===================================================== */

.scroll-container{

    position:relative;

    width:100%;

    height:700vh;

    z-index:10;

}


/* =====================================================
   FIXED VIDEO BACKGROUND
===================================================== */

.stage{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:#000;

    z-index:0;

}


/* =====================================================
   VIDEO SOURCE
===================================================== */

#video{

    position:absolute;

    width:2px;
    height:2px;

    opacity:0.001;

    pointer-events:none;

}


/* =====================================================
   CANVAS
===================================================== */

#canvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    background:#000;

    z-index:1;

}


/* =====================================================
   DARK CINEMATIC OVERLAY
===================================================== */

.overlay{

    position:absolute;

    inset:0;

    z-index:2;

    pointer-events:none;

    background:

        linear-gradient(
            180deg,
            rgba(0,0,0,.55),
            rgba(0,0,0,.08) 40%,
            rgba(0,0,0,.72)
        );

}


/* =====================================================
   RED LIGHT
===================================================== */

.red-light{

    position:absolute;

    inset:-30%;

    z-index:3;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 50% 50%,
            transparent 30%,
            rgba(255,0,0,.08) 55%,
            rgba(255,0,0,.22) 100%
        );

}


/* =====================================================
   SCANLINES
===================================================== */

.scanlines{

    position:absolute;

    inset:0;

    z-index:4;

    pointer-events:none;

    opacity:.10;

    background:

        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,0,0,.12) 4px
        );

}


/* =====================================================
   VIGNETTE
===================================================== */

.vignette{

    position:absolute;

    inset:0;

    z-index:5;

    pointer-events:none;

    box-shadow:
        inset 0 0 180px rgba(0,0,0,.95);

}


/* =====================================================
   HUD
===================================================== */

.hud{

    position:fixed;

    top:24px;
    left:25px;

    z-index:200;

    font-size:10px;

    letter-spacing:2px;

    line-height:1.9;

    color:#ff3434;

    text-shadow:
        0 0 10px rgba(255,0,0,.9);

    pointer-events:none;

}


.hud .white{

    color:#fff;

}


.hud .line{

    width:70px;

    height:1px;

    margin:5px 0;

    background:#ff2020;

    box-shadow:
        0 0 10px red;

}


/* =====================================================
   STATUS
===================================================== */

.status{

    position:fixed;

    top:25px;
    right:25px;

    z-index:200;

    font-size:9px;

    letter-spacing:3px;

    color:rgba(255,255,255,.7);

    text-align:right;

    pointer-events:none;

}


.status span{

    color:#ff3030;

    text-shadow:
        0 0 8px red;

}


/* =====================================================
   INTRO
===================================================== */

.intro{

    position:fixed;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    z-index:100;

    text-align:center;

    pointer-events:none;

    transition:
        opacity .25s ease;

}


.intro h1{

    font-size:
        clamp(42px,10vw,115px);

    font-weight:700;

    letter-spacing:
        clamp(5px,2vw,14px);

    color:#fff;

    text-shadow:

        0 0 10px rgba(255,0,0,.8),

        0 0 35px rgba(255,0,0,.5),

        0 0 80px rgba(255,0,0,.25);

}


.intro p{

    margin-top:18px;

    font-size:10px;

    letter-spacing:7px;

    color:#ff3333;

}


/* =====================================================
   SCROLL INDICATOR
===================================================== */

.scroll-indicator{

    position:fixed;

    bottom:25px;
    left:50%;

    transform:
        translateX(-50%);

    z-index:200;

    text-align:center;

    font-size:9px;

    letter-spacing:5px;

    color:rgba(255,255,255,.8);

    pointer-events:none;

}


.scroll-line{

    width:1px;

    height:45px;

    margin:10px auto 0;

    background:#ff2222;

    box-shadow:
        0 0 10px red;

    animation:
        scrollPulse 1.5s infinite;

}


@keyframes scrollPulse{

    0%{

        opacity:.2;

        transform:scaleY(.3);

        transform-origin:top;

    }

    50%{

        opacity:1;

        transform:scaleY(1);

    }

    100%{

        opacity:.2;

        transform:scaleY(.3);

        transform-origin:bottom;

    }

}


/* =====================================================
   SOCIAL ICONS
===================================================== */

.social-icons{

    position:fixed;

    inset:0;

    z-index:150;

    pointer-events:none;

}


/* =====================================================
   GLASS ICON
===================================================== */

.social-icon{

    position:absolute;

    width:64px;
    height:64px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:20px;

    text-decoration:none;

    color:#ff3535;

    font-size:25px;

    font-weight:bold;

    background:

        linear-gradient(
            135deg,
            rgba(255,30,30,.20),
            rgba(30,0,0,.35)
        );

    border:

        1px solid
        rgba(255,70,70,.55);

    backdrop-filter:
        blur(18px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(160%);

    box-shadow:

        0 10px 40px
        rgba(0,0,0,.5),

        0 0 25px
        rgba(255,0,0,.25),

        inset 0 1px 0
        rgba(255,255,255,.18),

        inset 0 0 15px
        rgba(255,0,0,.1);

    opacity:0;

    pointer-events:auto;

    transform:
        translateX(150px)
        scale(.7)
        rotate(15deg);

    transition:

        opacity .8s ease,

        transform
        1s cubic-bezier(.16,1,.3,1);

}


/* =====================================================
   ACTIVE
===================================================== */

.social-icon.active{

    opacity:1;

    transform:
        translateX(0)
        scale(1)
        rotate(0deg);

}


/* =====================================================
   GLASS SHINE
===================================================== */

.social-icon::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:80%;
    height:100%;

    background:

        linear-gradient(
            110deg,
            transparent 30%,
            rgba(255,255,255,.25),
            transparent 70%
        );

    transform:
        skewX(-20deg);

    animation:
        iconShine 4s infinite;

}


@keyframes iconShine{

    0%{
        left:-120%;
    }

    30%{
        left:130%;
    }

    100%{
        left:130%;
    }

}


/* =====================================================
   RED GLOW BORDER
===================================================== */

.social-icon::after{

    content:"";

    position:absolute;

    inset:-2px;

    border-radius:21px;

    border:
        1px solid
        rgba(255,0,0,.3);

    box-shadow:

        0 0 12px
        rgba(255,0,0,.35),

        inset 0 0 10px
        rgba(255,0,0,.15);

    pointer-events:none;

}


/* =====================================================
   RANDOM POSITIONS
===================================================== */

.instagram{

    top:21%;

    right:13%;

}


.tiktok{

    top:42%;

    right:8%;

}


.facebook{

    top:60%;

    right:18%;

}


.youtube{

    top:76%;

    right:8%;

}


/* =====================================================
   FLOATING ANIMATION
===================================================== */

.instagram.active{

    animation:
        floatInstagram 4.8s ease-in-out infinite;

}


.tiktok.active{

    animation:
        floatTikTok 5.5s ease-in-out infinite;

}


.facebook.active{

    animation:
        floatFacebook 4.4s ease-in-out infinite;

}


.youtube.active{

    animation:
        floatYoutube 5.8s ease-in-out infinite;

}


/* =====================================================
   FLOAT 1
===================================================== */

@keyframes floatInstagram{

    0%,
    100%{

        margin-top:0;

        margin-left:0;

        transform:
            rotate(-4deg)
            scale(1);

    }

    50%{

        margin-top:15px;

        margin-left:-18px;

        transform:
            rotate(5deg)
            scale(1.04);

    }

}


/* =====================================================
   FLOAT 2
===================================================== */

@keyframes floatTikTok{

    0%,
    100%{

        margin-top:0;

        margin-left:0;

        transform:
            rotate(5deg)
            scale(1);

    }

    50%{

        margin-top:-20px;

        margin-left:20px;

        transform:
            rotate(-6deg)
            scale(1.05);

    }

}


/* =====================================================
   FLOAT 3
===================================================== */

@keyframes floatFacebook{

    0%,
    100%{

        margin-top:0;

        margin-left:0;

        transform:
            rotate(-3deg)
            scale(1);

    }

    50%{

        margin-top:-18px;

        margin-left:-15px;

        transform:
            rotate(6deg)
            scale(1.03);

    }

}


/* =====================================================
   FLOAT 4
===================================================== */

@keyframes floatYoutube{

    0%,
    100%{

        margin-top:0;

        margin-left:0;

        transform:
            rotate(4deg)
            scale(1);

    }

    50%{

        margin-top:18px;

        margin-left:22px;

        transform:
            rotate(-6deg)
            scale(1.05);

    }

}


/* =====================================================
   PROGRESS BAR
===================================================== */

.progress{

    position:fixed;

    bottom:0;
    left:0;

    height:3px;

    width:0%;

    z-index:500;

    background:#ff2020;

    box-shadow:

        0 0 15px red,

        0 0 30px
        rgba(255,0,0,.5);

}


/* =====================================================
   END
===================================================== */

.end{

    position:relative;

    z-index:20;

    height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#030303;

}


.end h1{

    font-size:
        clamp(30px,8vw,70px);

    letter-spacing:8px;

    color:#ff2222;

    text-shadow:
        0 0 25px red;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .hud{

        top:15px;

        left:15px;

        font-size:8px;

    }


    .status{

        top:15px;

        right:15px;

        font-size:7px;

    }


    .intro h1{

        letter-spacing:5px;

    }


    .intro p{

        letter-spacing:4px;

    }


    .social-icon{

        width:53px;
        height:53px;

        border-radius:17px;

        font-size:21px;

    }


    .instagram{

        top:23%;

        right:9%;

    }


    .tiktok{

        top:42%;

        right:7%;

    }


    .facebook{

        top:59%;

        right:13%;

    }


    .youtube{

        top:74%;

        right:8%;

    }


    .scroll-indicator{

        bottom:15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     FIXED VIDEO BACKGROUND
===================================================== -->

<div class="stage">


    <video
        id="video"
        src="12.mp4"
        preload="auto"
        muted
        playsinline>
    </video>


    <canvas
        id="canvas">
    </canvas>


    <div class="overlay"></div>

    <div class="red-light"></div>

    <div class="scanlines"></div>

    <div class="vignette"></div>


</div>



<!-- =====================================================
     SCROLL CONTENT
===================================================== -->

<div
    class="scroll-container"
    id="scrollContainer">


    <!-- =================================================
         HUD
    ================================================= -->

    <div class="hud">

        <div>
            ALMOHSEN // SYSTEM
        </div>

        <div class="line"></div>

        <div class="white">
            VIDEO : 12.MP4
        </div>

        <div>
            FRAME :
            <span id="frame">
                0000
            </span>
        </div>

        <div>
            PROGRESS :
            <span id="percent">
                0
            </span>%
        </div>

    </div>



    <!-- =================================================
         STATUS
    ================================================= -->

    <div class="status">

        SYSTEM
        <span>ONLINE</span>

        <br>

        VIDEO
        <span>READY</span>

        <br>

        MODE
        <span>SCROLL</span>

    </div>



    <!-- =================================================
         INTRO
    ================================================= -->

    <div
        class="intro"
        id="intro">

        <h1>
            ALMOHSEN
        </h1>

        <p>
            SCROLL TO EXPERIENCE
        </p>

    </div>



    <!-- =================================================
         SOCIAL ICONS
    ================================================= -->

    <div class="social-icons">


        <!-- INSTAGRAM -->

        <a
            class="social-icon instagram"
            href="#"
            target="_blank"
            aria-label="Instagram">

            ◎

        </a>



        <!-- TIKTOK -->

        <a
            class="social-icon tiktok"
            href="#"
            target="_blank"
            aria-label="TikTok">

            ♪

        </a>



        <!-- FACEBOOK -->

        <a
            class="social-icon facebook"
            href="#"
            target="_blank"
            aria-label="Facebook">

            f

        </a>



        <!-- YOUTUBE -->

        <a
            class="social-icon youtube"
            href="#"
            target="_blank"
            aria-label="YouTube">

            ▶

        </a>


    </div>



    <!-- =================================================
         SCROLL INDICATOR
    ================================================= -->

    <div class="scroll-indicator">

        SCROLL

        <div class="scroll-line"></div>

    </div>



    <!-- =================================================
         PROGRESS
    ================================================= -->

    <div
        class="progress"
        id="progressBar">
    </div>


</div>



<!-- =====================================================
     END
===================================================== -->

<section class="end">

    <h1>
        THANK YOU
    </h1>

</section>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById(
        "video"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const container =
    document.getElementById(
        "scrollContainer"
    );


const frameText =
    document.getElementById(
        "frame"
    );


const percentText =
    document.getElementById(
        "percent"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const intro =
    document.getElementById(
        "intro"
    );


const socialIcons =
    document.querySelectorAll(
        ".social-icon"
    );


/* =====================================================
   VARIABLES
===================================================== */

let ready = false;

let duration = 0;

let lastTime = -1;

let ticking = false;


/* =====================================================
   RESIZE
===================================================== */

function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

    drawFrame();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   VIDEO METADATA
===================================================== */

video.addEventListener(
    "loadedmetadata",
    function(){

        duration =
            video.duration;

        ready = true;

        resizeCanvas();

        update();

    }
);


/* =====================================================
   VIDEO READY
===================================================== */

video.addEventListener(
    "canplay",
    function(){

        ready = true;

        drawFrame();

        update();

    }
);


/* =====================================================
   DRAW VIDEO
===================================================== */

function drawFrame(){

    if(
        !ready ||
        video.readyState < 2
    ){

        return;

    }


    const vw =
        video.videoWidth;


    const vh =
        video.videoHeight;


    if(
        !vw ||
        !vh
    ){

        return;

    }


    const cw =
        canvas.width;


    const ch =
        canvas.height;


    /*
       ORIGINAL VIDEO RATIO

       No stretching.
       No squeezing.
       Only cropping.
    */


    const videoRatio =
        vw / vh;


    const screenRatio =
        cw / ch;


    let width;

    let height;


    if(
        screenRatio >
        videoRatio
    ){

        width =
            cw;

        height =
            cw /
            videoRatio;

    }else{

        height =
            ch;

        width =
            ch *
            videoRatio;

    }


    const x =
        (cw - width) / 2;


    const y =
        (ch - height) / 2;


    ctx.clearRect(
        0,
        0,
        cw,
        ch
    );


    ctx.drawImage(
        video,
        x,
        y,
        width,
        height
    );

}


/* =====================================================
   SEEKED
===================================================== */

video.addEventListener(
    "seeked",
    function(){

        drawFrame();

    }
);


/* =====================================================
   MAIN UPDATE
===================================================== */

function update(){

    ticking = false;


    if(
        !ready ||
        !duration
    ){

        return;

    }


    /* TOTAL SCROLL */

    const total =
        container.offsetHeight -
        window.innerHeight;


    /* PROGRESS */

    let progress =
        window.scrollY /
        total;


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    /* =================================================
       VIDEO
    ================================================= */

    const targetTime =
        progress *
        Math.max(
            0,
            duration - 0.05
        );


    if(
        Math.abs(
            targetTime -
            lastTime
        ) > 0.004
    ){

        lastTime =
            targetTime;

        video.currentTime =
            targetTime;

    }


    /* =================================================
       FRAME
    ================================================= */

    const fps = 30;


    const currentFrame =
        Math.floor(
            targetTime *
            fps
        );


    frameText.textContent =
        String(
            currentFrame
        ).padStart(
            4,
            "0"
        );


    /* =================================================
       PERCENT
    ================================================= */

    const percent =
        Math.round(
            progress * 100
        );


    percentText.textContent =
        percent;


    /* =================================================
       PROGRESS BAR
    ================================================= */

    progressBar.style.width =
        percent + "%";


    /* =================================================
       INTRO
    ================================================= */

    if(
        progress >
        0.08
    ){

        intro.style.opacity =
            "0";

    }else{

        intro.style.opacity =
            String(
                1 -
                progress / 0.08
            );

    }


    /* =================================================
       SOCIAL ICONS
    ================================================= */

    const starts = [

        0.15,
        0.34,
        0.54,
        0.75

    ];


    socialIcons.forEach(
        function(icon,index){

            if(
                progress >=
                starts[index]
            ){

                icon.classList.add(
                    "active"
                );

            }else{

                icon.classList.remove(
                    "active"
                );

            }

        }
    );

}


/* =====================================================
   SCROLL
===================================================== */

window.addEventListener(
    "scroll",
    function(){

        if(
            !ticking
        ){

            requestAnimationFrame(
                update
            );

            ticking = true;

        }

    },
    {
        passive:true
    }
);


/* =====================================================
   INITIALIZE
===================================================== */

video.load();

resizeCanvas();

update();

</script>


</body>
</html>
