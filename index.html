<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Almohsen</title>


<style>

/* ================================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {

    background: #000;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;

}


/* ================================
   SCROLL SPACE
================================ */

.scroll-container {

    height: 600vh;

    position: relative;

}


/* ================================
   VIDEO STAGE
================================ */

.video-stage {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* ================================
   CANVAS
================================ */

#canvas {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: block;

}


/* ================================
   DARK GLASS OVERLAY
================================ */

.overlay {

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,.35) 100%
        );

    pointer-events: none;

}


/* ================================
   INTRO
================================ */

.intro {

    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    transition:
        opacity .5s ease;

    pointer-events: none;

}


.intro h1 {

    font-size:
        clamp(50px, 12vw, 130px);

    font-weight: 800;

    letter-spacing: 4px;

    text-transform: uppercase;

    text-shadow:

        0 0 10px rgba(255,255,255,.4),

        0 0 30px rgba(255,0,0,.25);

}


.intro p {

    margin-top: 15px;

    font-size: 16px;

    opacity: .8;

}


/* ================================
   SOCIAL PANEL
================================ */

.social-container {

    position: absolute;

    right: 0;

    top: 50%;

    transform:
        translateY(-50%);

    width: min(420px, 88vw);

    display: flex;

    flex-direction: column;

    gap: 14px;

    padding: 20px;

}


/* ================================
   SOCIAL CARD
================================ */

.social {

    position: relative;

    display: flex;

    align-items: center;

    gap: 15px;

    min-height: 70px;

    padding: 15px 20px;

    color: white;

    text-decoration: none;

    border-radius: 18px 0 0 18px;


    /* GLASS */

    background:

        linear-gradient(
            135deg,
            rgba(255,0,0,.30),
            rgba(80,0,0,.18)
        );


    border:

        1px solid
        rgba(255,80,80,.55);


    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);


    box-shadow:

        inset 0 0 25px
        rgba(255,0,0,.08),

        0 10px 35px
        rgba(0,0,0,.45),

        -10px 0 30px
        rgba(255,0,0,.08);


    /* START OUTSIDE SCREEN */

    opacity: 0;

    transform:
        translateX(120%);


    transition:

        transform .75s
        cubic-bezier(.16,1,.3,1),

        opacity .5s ease;


    overflow: hidden;

}


/* ================================
   RED LIGHT LINE
================================ */

.social::before {

    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 4px;

    height: 100%;

    background:

        linear-gradient(
            to bottom,
            transparent,
            #ff3030,
            transparent
        );

    box-shadow:

        0 0 15px
        rgba(255,0,0,.9);

}


/* ================================
   MOVING LIGHT
================================ */

.social::after {

    content: "";

    position: absolute;

    top: 0;

    left: -120%;

    width: 80%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:
        left .7s ease;

}


.social:hover::after {

    left: 140%;

}


/* ================================
   SHOW CARD
================================ */

.social.show {

    opacity: 1;

    transform:
        translateX(0);

}


/* ================================
   ICON
================================ */

.icon {

    width: 42px;

    height: 42px;

    min-width: 42px;

    border-radius: 12px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 20px;

    background:

        rgba(255,0,0,.22);

    border:

        1px solid
        rgba(255,100,100,.4);

    box-shadow:

        inset 0 0 15px
        rgba(255,0,0,.15),

        0 0 15px
        rgba(255,0,0,.12);

}


/* ================================
   TEXT
================================ */

.social-text {

    display: flex;

    flex-direction: column;

    gap: 4px;

}


.social-title {

    font-size: 15px;

    font-weight: bold;

}


.social-user {

    font-size: 12px;

    opacity: .65;

}


/* ================================
   SCROLL HINT
================================ */

.scroll-hint {

    position: absolute;

    bottom: 30px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 13px;

    opacity: .75;

    transition:
        opacity .4s ease;

}


.scroll-arrow {

    margin-top: 8px;

    text-align: center;

    font-size: 20px;

    animation:
        bounce 1.5s infinite;

}


@keyframes bounce {

    0%,100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(8px);

    }

}


/* ================================
   LOADING
================================ */

.loading {

    position: absolute;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%,-50%);

    font-size: 14px;

    z-index: 20;

}


/* ================================
   MOBILE
================================ */

@media(max-width:600px) {

    .social-container {

        width: 92vw;

        padding: 10px;

        gap: 10px;

    }


    .social {

        min-height: 62px;

        padding: 12px 15px;

    }


    .intro h1 {

        letter-spacing: 2px;

    }

}

</style>

</head>


<body>


<!-- =================================
     VIDEO
================================= -->

<video

    id="video"

    src="12.mp4"

    preload="auto"

    muted

    playsinline

    webkit-playsinline

    style="display:none;">

</video>



<!-- =================================
     SCROLL CONTAINER
================================= -->

<section class="scroll-container">


    <!-- =================================
         STICKY VIDEO
    ================================= -->

    <div class="video-stage">


        <canvas id="canvas"></canvas>


        <div class="overlay"></div>



        <!-- =================================
             INTRO
        ================================= -->

        <div
            class="intro"
            id="intro">

            <div>

                <h1>
                    Almohsen
                </h1>

                <p>
                    SCROLL TO EXPLORE
                </p>

            </div>

        </div>



        <!-- =================================
             SOCIAL ACCOUNTS
        ================================= -->

        <div class="social-container">


            <!-- INSTAGRAM -->

            <a

                class="social"

                data-start="0.25"

                href="https://instagram.com/YOUR_USERNAME"

                target="_blank"

                rel="noopener">


                <div class="icon">

                    ◎

                </div>


                <div
                    class="social-text">

                    <div
                        class="social-title">

                        Instagram

                    </div>

                    <div
                        class="social-user">

                        @YOUR_USERNAME

                    </div>

                </div>


            </a>



            <!-- TIKTOK -->

            <a

                class="social"

                data-start="0.40"

                href="https://tiktok.com/@YOUR_USERNAME"

                target="_blank"

                rel="noopener">


                <div class="icon">

                    ♪

                </div>


                <div
                    class="social-text">

                    <div
                        class="social-title">

                        TikTok

                    </div>

                    <div
                        class="social-user">

                        @YOUR_USERNAME

                    </div>

                </div>


            </a>



            <!-- FACEBOOK -->

            <a

                class="social"

                data-start="0.55"

                href="https://facebook.com/YOUR_USERNAME"

                target="_blank"

                rel="noopener">


                <div class="icon">

                    f

                </div>


                <div
                    class="social-text">

                    <div
                        class="social-title">

                        Facebook

                    </div>

                    <div
                        class="social-user">

                        YOUR_USERNAME

                    </div>

                </div>


            </a>



            <!-- YOUTUBE -->

            <a

                class="social"

                data-start="0.70"

                href="https://youtube.com/@YOUR_USERNAME"

                target="_blank"

                rel="noopener">


                <div class="icon">

                    ▶

                </div>


                <div
                    class="social-text">

                    <div
                        class="social-title">

                        YouTube

                    </div>

                    <div
                        class="social-user">

                        @YOUR_USERNAME

                    </div>

                </div>


            </a>


        </div>



        <!-- =================================
             SCROLL HINT
        ================================= -->

        <div
            class="scroll-hint"
            id="scrollHint">

            SCROLL

            <div
                class="scroll-arrow">

                ↓

            </div>

        </div>



        <!-- =================================
             LOADING
        ================================= -->

        <div
            class="loading"
            id="loading">

            Loading 12.mp4...

        </div>


    </div>

</section>



<script>

/* ==========================================
   ELEMENTS
========================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const container =
    document.querySelector(
        ".scroll-container"
    );

const intro =
    document.getElementById("intro");

const hint =
    document.getElementById(
        "scrollHint"
    );

const loading =
    document.getElementById(
        "loading"
    );

const socials =
    document.querySelectorAll(
        ".social"
    );


/* ==========================================
   VARIABLES
========================================== */

let ready = false;

let duration = 0;

let lastTime = -1;

let raf = null;


/* ==========================================
   CANVAS
========================================== */

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        window.innerWidth * dpr;

    canvas.height =
        window.innerHeight * dpr;


    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    drawFrame();

}


/* ==========================================
   DRAW FRAME
========================================== */

function drawFrame() {

    if (
        !ready ||
        !video.videoWidth
    ) {

        return;

    }


    const cw =
        window.innerWidth;

    const ch =
        window.innerHeight;


    const vw =
        video.videoWidth;

    const vh =
        video.videoHeight;


    const scale =
        Math.max(
            cw / vw,
            ch / vh
        );


    const width =
        vw * scale;

    const height =
        vh * scale;


    const x =
        (cw - width) / 2;

    const y =
        (ch - height) / 2;


    ctx.clearRect(
        0,
        0,
        cw,
        ch
    );


    ctx.drawImage(
        video,
        x,
        y,
        width,
        height
    );

}


/* ==========================================
   VIDEO READY
========================================== */

function videoReady() {

    if (ready)
        return;


    if (!video.duration)
        return;


    duration =
        video.duration;


    ready = true;


    loading.style.display =
        "none";


    resizeCanvas();


    update();


}


/* ==========================================
   VIDEO EVENTS
========================================== */

video.addEventListener(
    "loadedmetadata",
    videoReady
);

video.addEventListener(
    "loadeddata",
    videoReady
);

video.addEventListener(
    "canplay",
    videoReady
);

video.addEventListener(
    "seeked",
    drawFrame
);


/* ==========================================
   UPDATE
========================================== */

function update() {

    raf = null;


    if (
        !ready ||
        duration <= 0
    ) {

        return;

    }


    const rect =
        container.getBoundingClientRect();


    const max =
        container.offsetHeight -
        window.innerHeight;


    let progress =
        -rect.top / max;


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    /* ================================
       VIDEO
    ================================= */

    const target =
        progress * duration;


    if (
        Math.abs(
            target - lastTime
        ) > 0.01
    ) {

        lastTime =
            target;

        video.currentTime =
            target;

    }


    /* ================================
       INTRO
    ================================= */

    if (progress < .15) {

        intro.style.opacity =
            String(
                1 -
                progress / .15
            );

    }

    else {

        intro.style.opacity =
            "0";

    }


    /* ================================
       SCROLL HINT
    ================================= */

    hint.style.opacity =
        progress > .08
        ? "0"
        : ".75";


    /* ================================
       SOCIAL PANELS
    ================================= */

    socials.forEach(
        function(card) {

            const start =
                parseFloat(
                    card.dataset.start
                );


            if (progress >= start) {

                card.classList.add(
                    "show"
                );

            }

            else {

                card.classList.remove(
                    "show"
                );

            }

        }
    );

}


/* ==========================================
   SCROLL
========================================== */

window.addEventListener(
    "scroll",
    function() {

        if (!raf) {

            raf =
                requestAnimationFrame(
                    update
                );

        }

    },
    {
        passive: true
    }
);


/* ==========================================
   RESIZE
========================================== */

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ==========================================
   ERROR
========================================== */

video.addEventListener(
    "error",
    function() {

        loading.innerHTML =
            "❌ لم يتم العثور على 12.mp4";

    }
);


/* ==========================================
   LOAD
========================================== */

video.load();

</script>


</body>

</html>
