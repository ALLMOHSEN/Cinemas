<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Scroll Website</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html {
    scroll-behavior: auto;
}
body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}
/* مساحة التمرير */
.scroll-area {
    height: 600vh;
}
/* الشاشة الثابتة */
.sticky {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #000;
}
/* الفيديو */
canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
/* طبقة داكنة */
.overlay {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.05),
            rgba(0,0,0,0.65)
        );
    pointer-events: none;
}
/* العنوان */
.hero-text {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: opacity .5s ease;
    pointer-events: none;
}
.hero-text h1 {
    font-size: clamp(35px, 8vw, 90px);
    margin-bottom: 15px;
}
.hero-text p {
    font-size: clamp(15px, 3vw, 22px);
    opacity: .85;
}
/* حسابات التواصل */
.social-container {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}
/* زر الحساب */
.social {
    color: white;
    text-decoration: none;
    padding: 13px 20px;
    border-radius: 50px;
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.3);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    opacity: 0;
    transform:
        translateY(30px)
        scale(.9);
    transition:
        opacity .5s ease,
        transform .5s ease,
        background .3s ease;
}
/* عندما يظهر */
.social.show {
    opacity: 1;
    transform:
        translateY(0)
        scale(1);
}
.social:hover {
    background: rgba(255,255,255,.2);
}
/* تعليمات */
.scroll-hint {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    opacity: .7;
    animation: bounce 1.5s infinite;
}
@keyframes bounce {
    0%,100% {
        transform:
            translateX(-50%)
            translateY(0);
    }
    50% {
        transform:
            translateX(-50%)
            translateY(-8px);
    }
}
/* تحميل */
.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    font-size: 14px;
    color: white;
    z-index: 10;
}
/* الهاتف */
@media(max-width:600px) {
    .social-container {
        bottom: 6%;
        gap: 8px;
    }
    .social {
        padding: 10px 14px;
        font-size: 13px;
    }
}
</style>
</head>
<body>
<!--
==================================================
الفيديو
==================================================
ضع ملف الفيديو بجانب index.html
مثال:
index.html
video.mp4
ثم اكتب:
video.mp4
إذا كان اسم الفيديو مختلفاً، غيّر الاسم هنا.
-->
<video
    id="video"
    src="video.mp4"
    preload="auto"
    muted
    playsinline
    style="display:none">
</video>
<!-- مساحة التمرير -->
<section class="scroll-area">
    <div class="sticky">
        <!-- Canvas يعرض Frames الفيديو -->
        <canvas id="canvas"></canvas>
        <!-- طبقة فوق الفيديو -->
        <div class="overlay"></div>
        <!-- العنوان -->
        <div
            class="hero-text"
            id="heroText">
            <div>
                <!-- غيّر اسمك هنا -->
                <h1>
                    اسمك هنا
                </h1>
                <p>
                    اسحب للأسفل
                </p>
            </div>
        </div>
        <!-- حسابات التواصل -->
        <div class="social-container">
            <!-- Instagram -->
            <a
                class="social"
                data-start="0.25"
                href="https://instagram.com/YOUR_USERNAME"
                target="_blank"
                rel="noopener">
                Instagram
                ·
                @YOUR_USERNAME
            </a>
            <!-- TikTok -->
            <a
                class="social"
                data-start="0.40"
                href="https://tiktok.com/@YOUR_USERNAME"
                target="_blank"
                rel="noopener">
                TikTok
                ·
                @YOUR_USERNAME
            </a>
            <!-- Facebook -->
            <a
                class="social"
                data-start="0.55"
                href="https://facebook.com/YOUR_USERNAME"
                target="_blank"
                rel="noopener">
                Facebook
                ·
                YOUR_USERNAME
            </a>
            <!-- YouTube -->
            <a
                class="social"
                data-start="0.70"
                href="https://youtube.com/@YOUR_USERNAME"
                target="_blank"
                rel="noopener">
                YouTube
                ·
                @YOUR_USERNAME
            </a>
        </div>
        <!-- تعليمات التمرير -->
        <div
            class="scroll-hint"
            id="scrollHint">
            ↓ اسحب للأسفل ↓
        </div>
        <!-- التحميل -->
        <div
            class="loading"
            id="loading">
            جاري تحميل الفيديو...
        </div>
    </div>
</section>
<script>
/*
====================================================
الإعدادات
====================================================
*/
const video =
    document.getElementById("video");
const canvas =
    document.getElementById("canvas");
const ctx =
    canvas.getContext("2d");
const scrollArea =
    document.querySelector(".scroll-area");
const heroText =
    document.getElementById("heroText");
const scrollHint =
    document.getElementById("scrollHint");
const loading =
    document.getElementById("loading");
const socials =
    document.querySelectorAll(".social");
let videoReady = false;
let duration = 0;
let animationFrame = null;
/*
====================================================
تغيير حجم Canvas
====================================================
*/
function resizeCanvas() {
    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );
    canvas.width =
        window.innerWidth * dpr;
    canvas.height =
        window.innerHeight * dpr;
    canvas.style.width =
        window.innerWidth + "px";
    canvas.style.height =
        window.innerHeight + "px";
    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
    drawFrame();
}
/*
====================================================
رسم Frame الفيديو
====================================================
*/
function drawFrame() {
    if (
        !videoReady ||
        !video.videoWidth
    ) {
        return;
    }
    const canvasWidth =
        window.innerWidth;
    const canvasHeight =
        window.innerHeight;
    const videoWidth =
        video.videoWidth;
    const videoHeight =
        video.videoHeight;
    /*
    جعل الفيديو يغطي الشاشة
    مثل background-size: cover
    */
    const scale =
        Math.max(
            canvasWidth / videoWidth,
            canvasHeight / videoHeight
        );
    const width =
        videoWidth * scale;
    const height =
        videoHeight * scale;
    const x =
        (canvasWidth - width) / 2;
    const y =
        (canvasHeight - height) / 2;
    ctx.clearRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );
    ctx.drawImage(
        video,
        x,
        y,
        width,
        height
    );
}
/*
====================================================
حساب Scroll
====================================================
*/
function updateScroll() {
    if (
        !videoReady ||
        !duration
    ) {
        return;
    }
    const rect =
        scrollArea.getBoundingClientRect();
    const totalScroll =
        scrollArea.offsetHeight -
        window.innerHeight;
    let progress =
        -rect.top / totalScroll;
    /*
    التأكد أن القيمة بين 0 و 1
    */
    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );
    /*
    تحويل Scroll إلى وقت الفيديو
    */
    const targetTime =
        progress * duration;
    /*
    تحريك الفيديو Frame by Frame
    */
    if (
        Math.abs(
            video.currentTime -
            targetTime
        ) > 0.01
    ) {
        video.currentTime =
            targetTime;
    }
    /*
    إخفاء العنوان
    */
    if (progress > 0.15) {
        heroText.style.opacity = "0";
    } else {
        heroText.style.opacity =
            1 -
            (progress / 0.15);
    }
    /*
    إخفاء تعليمات Scroll
    */
    if (progress > 0.08) {
        scrollHint.style.opacity = "0";
    } else {
        scrollHint.style.opacity = "0.7";
    }
    /*
    إظهار حسابات التواصل
    */
    socials.forEach(
        function(element) {
            const start =
                parseFloat(
                    element.dataset.start
                );
            if (progress >= start) {
                element.classList.add(
                    "show"
                );
            } else {
                element.classList.remove(
                    "show"
                );
            }
        }
    );
}
/*
====================================================
Scroll Event
====================================================
*/
window.addEventListener(
    "scroll",
    function() {
        if (!animationFrame) {
            animationFrame =
                requestAnimationFrame(
                    function() {
                        updateScroll();
                        animationFrame =
                            null;
                    }
                );
        }
    },
    {
        passive: true
    }
);
/*
====================================================
تحميل الفيديو
====================================================
*/
video.addEventListener(
    "loadedmetadata",
    function() {
        duration =
            video.duration;
        videoReady =
            true;
        loading.style.display =
            "none";
        resizeCanvas();
        updateScroll();
    }
);
/*
====================================================
عند تغيير Frame
====================================================
*/
video.addEventListener(
    "seeked",
    function() {
        drawFrame();
    }
);
/*
====================================================
تغيير حجم الشاشة
====================================================
*/
window.addEventListener(
    "resize",
    function() {
        resizeCanvas();
    }
);
/*
====================================================
خطأ الفيديو
====================================================
*/
video.addEventListener(
    "error",
    function() {
        loading.innerHTML =
            "❌ لم يتم العثور على video.mp4";
    }
);
/*
====================================================
منع التشغيل العادي
====================================================
*/
video.pause();
</script>
</body>
</html>
