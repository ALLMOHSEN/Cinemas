<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALMOHSEN — Cinematic Portfolio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#000;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}

/* =================================
   SCROLL AREA
================================= */

.scroll-container{
    position:relative;
    height:700vh;
    width:100%;
    z-index:10;
    pointer-events:none;
}

/* =================================
   FIXED VIDEO BACKGROUND
================================= */

.stage{
    position:fixed;

    top:0;
    left:0;
    right:0;
    bottom:0;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:#000;

    z-index:0;
}

/* =================================
   HIDDEN VIDEO SOURCE
================================= */

#video{
    position:absolute;

    width:1px;
    height:1px;

    opacity:0.01;

    pointer-events:none;
}

/* =================================
   VIDEO CANVAS
================================= */

#canvas{
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:#000;

    z-index:1;
}

/* =================================
   DARK OVERLAY
================================= */

.overlay{
    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.35),
            rgba(0,0,0,.05) 40%,
            rgba(0,0,0,.75)
        );

    z-index:2;

    pointer-events:none;
}

/* =================================
   RED CINEMATIC LIGHT
================================= */

.red-light{
    position:absolute;

    inset:-20%;

    background:
        radial-gradient(
            circle at 50% 50%,
            transparent 40%,
            rgba(255,0,0,.18),
            transparent 75%
        );

    z-index:3;

    pointer-events:none;
}

/* =================================
   HUD
================================= */

.hud{
    position:fixed;

    top:25px;
    left:25px;

    z-index:100;

    font-size:11px;

    letter-spacing:2px;

    color:#ff4d4d;

    line-height:1.8;

    text-shadow:
        0 0 10px red;

    pointer-events:none;
}

.hud .white{
    color:white;
}

/* =================================
   INTRO
================================= */

.intro{
    position:fixed;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    text-align:center;

    z-index:100;

    pointer-events:none;

    transition:opacity .2s;
}

.intro h1{

    font-size:
        clamp(40px,10vw,110px);

    letter-spacing:10px;

    color:white;

    text-shadow:
        0 0 15px rgba(255,0,0,.7),
        0 0 40px rgba(255,0,0,.5);
}

.intro p{

    margin-top:15px;

    font-size:12px;

    letter-spacing:6px;

    color:#ff3333;
}

/* =================================
   SCROLL INDICATOR
================================= */

.scroll{

    position:fixed;

    bottom:25px;
    left:50%;

    transform:
        translateX(-50%);

    z-index:100;

    font-size:10px;

    letter-spacing:4px;

    color:white;

    opacity:.7;

    pointer-events:none;
}

.scroll::after{

    content:"";

    display:block;

    width:1px;

    height:45px;

    margin:10px auto 0;

    background:#ff2020;

    animation:pulse 1.4s infinite;
}

@keyframes pulse{

    0%,
    100%{
        opacity:.2;
        transform:scaleY(.5);
    }

    50%{
        opacity:1;
        transform:scaleY(1);
    }

}

/* =================================
   SOCIAL CONTAINER
================================= */

.social-container{

    position:fixed;

    top:50%;
    right:0;

    transform:
        translateY(-50%);

    width:
        min(430px,90vw);

    z-index:200;

    pointer-events:none;
}

/* =================================
   SOCIAL CARD
================================= */

.card{

    position:absolute;

    right:-500px;

    width:
        min(390px,85vw);

    padding:22px;

    margin-bottom:18px;

    border:
        1px solid rgba(255,50,50,.65);

    border-right:
        3px solid #ff2020;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(80,0,0,.55),
            rgba(15,0,0,.75)
        );

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        0 0 25px rgba(255,0,0,.15),
        inset 0 0 25px rgba(255,0,0,.06);

    transition:
        right .8s cubic-bezier(.16,1,.3,1),
        opacity .5s;

    opacity:0;

    pointer-events:auto;
}

/* =================================
   CARD ACTIVE
================================= */

.card.active{

    right:30px;

    opacity:1;
}

/* =================================
   CARD TOP
================================= */

.card-top{

    display:flex;

    align-items:center;

    gap:15px;
}

/* =================================
   ICON
================================= */

.icon{

    width:50px;
    height:50px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:
        rgba(255,0,0,.12);

    border:
        1px solid rgba(255,0,0,.5);

    color:#ff3333;

    font-size:20px;

    box-shadow:
        0 0 15px rgba(255,0,0,.2);
}

/* =================================
   CARD TITLE
================================= */

.card h2{

    font-size:17px;

    letter-spacing:2px;

    margin-bottom:5px;
}

.card p{

    color:#aaa;

    font-size:12px;

    letter-spacing:1px;
}

/* =================================
   CARD LINK
================================= */

.card a{

    display:block;

    margin-top:15px;

    color:#ff4444;

    text-decoration:none;

    font-size:12px;

    letter-spacing:2px;
}

/* =================================
   SCAN EFFECT
================================= */

.card::after{

    content:"";

    position:absolute;

    left:0;
    right:0;

    top:0;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff2222,
            transparent
        );

    animation:
        scan 3s linear infinite;
}

@keyframes scan{

    0%{
        transform:
            translateY(0);

        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:
            translateY(120px);

        opacity:0;
    }

}

/* =================================
   PROGRESS BAR
================================= */

.progress{

    position:fixed;

    bottom:0;
    left:0;

    height:3px;

    width:0%;

    background:#ff2020;

    box-shadow:
        0 0 15px red;

    z-index:300;
}

/* =================================
   END SECTION
================================= */

.end{

    position:relative;

    z-index:20;

    height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#050505;

    text-align:center;

    pointer-events:auto;
}

.end h1{

    font-size:40px;

    letter-spacing:8px;

    color:#ff2020;

    text-shadow:
        0 0 20px red;
}

/* =================================
   MOBILE
================================= */

@media(max-width:600px){

    .hud{

        top:15px;
        left:15px;

        font-size:9px;
    }

    .intro h1{

        letter-spacing:5px;
    }

    .social-container{

        top:auto;

        bottom:70px;

        transform:none;
    }

    .card.active{

        right:15px;
    }

    .card{

        width:
            calc(100vw - 30px);
    }

}

</style>
</head>


<body>


<!-- =================================
     FIXED VIDEO BACKGROUND
================================= -->

<div class="stage">

    <!-- VIDEO -->
    <video
        id="video"
        src="12.mp4"
        preload="auto"
        muted
        playsinline>
    </video>

    <!-- CANVAS -->
    <canvas id="canvas"></canvas>

    <!-- EFFECTS -->
    <div class="overlay"></div>

    <div class="red-light"></div>

</div>


<!-- =================================
     SCROLL AREA
================================= -->

<div
    class="scroll-container"
    id="scrollContainer">


    <!-- =================================
         HUD
    ================================= -->

    <div class="hud">

        <div>
            ALMOHSEN // SYSTEM
        </div>

        <div class="white">
            VIDEO : 12.MP4
        </div>

        <div>
            FRAME :
            <span id="frame">
                0000
            </span>
        </div>

        <div>
            PROGRESS :
            <span id="percent">
                0
            </span>%
        </div>

    </div>


    <!-- =================================
         INTRO
    ================================= -->

    <div
        class="intro"
        id="intro">

        <h1>
            ALMOHSEN
        </h1>

        <p>
            SCROLL TO EXPERIENCE
        </p>

    </div>


    <!-- =================================
         SOCIAL CARDS
    ================================= -->

    <div class="social-container">


        <!-- INSTAGRAM -->

        <div
            class="card"
            data-start="0.18">

            <div class="card-top">

                <div class="icon">
                    ◎
                </div>

                <div>

                    <h2>
                        INSTAGRAM
                    </h2>

                    <p>
                        @YOUR_USERNAME
                    </p>

                </div>

            </div>

            <a
                href="#"
                target="_blank">

                OPEN PROFILE →

            </a>

        </div>


        <!-- TIKTOK -->

        <div
            class="card"
            data-start="0.38">

            <div class="card-top">

                <div class="icon">
                    ♪
                </div>

                <div>

                    <h2>
                        TIKTOK
                    </h2>

                    <p>
                        @YOUR_USERNAME
                    </p>

                </div>

            </div>

            <a
                href="#"
                target="_blank">

                OPEN PROFILE →

            </a>

        </div>


        <!-- FACEBOOK -->

        <div
            class="card"
            data-start="0.58">

            <div class="card-top">

                <div class="icon">
                    f
                </div>

                <div>

                    <h2>
                        FACEBOOK
                    </h2>

                    <p>
                        YOUR NAME
                    </p>

                </div>

            </div>

            <a
                href="#"
                target="_blank">

                OPEN PROFILE →

            </a>

        </div>


        <!-- YOUTUBE -->

        <div
            class="card"
            data-start="0.78">

            <div class="card-top">

                <div class="icon">
                    ▶
                </div>

                <div>

                    <h2>
                        YOUTUBE
                    </h2>

                    <p>
                        YOUR CHANNEL
                    </p>

                </div>

            </div>

            <a
                href="#"
                target="_blank">

                OPEN CHANNEL →

            </a>

        </div>

    </div>


    <!-- =================================
         SCROLL INDICATOR
    ================================= -->

    <div class="scroll">
        SCROLL
    </div>


    <!-- =================================
         PROGRESS
    ================================= -->

    <div
        class="progress"
        id="progressBar">
    </div>

</div>


<!-- =================================
     END
================================= -->

<section class="end">

    <h1>
        THANK YOU
    </h1>

</section>



<script>

/* =================================
   ELEMENTS
================================= */

const container =
    document.getElementById(
        "scrollContainer"
    );

const video =
    document.getElementById(
        "video"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

const frameText =
    document.getElementById(
        "frame"
    );

const percentText =
    document.getElementById(
        "percent"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const intro =
    document.getElementById(
        "intro"
    );

const cards =
    document.querySelectorAll(
        ".card"
    );


/* =================================
   VARIABLES
================================= */

let duration = 0;

let ready = false;

let lastTime = -1;

let ticking = false;


/* =================================
   CANVAS RESIZE
================================= */

function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

    drawFrame();
}


/* =================================
   WINDOW RESIZE
================================= */

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =================================
   VIDEO METADATA
================================= */

video.addEventListener(
    "loadedmetadata",
    function(){

        duration =
            video.duration;

        ready = true;

        resizeCanvas();

        update();

    }
);


/* =================================
   VIDEO CAN PLAY
================================= */

video.addEventListener(
    "canplay",
    function(){

        ready = true;

        drawFrame();

        update();

    }
);


/* =================================
   DRAW VIDEO FRAME
================================= */

function drawFrame(){

    if(
        !ready ||
        video.readyState < 2
    ){

        return;
    }


    const vw =
        video.videoWidth;

    const vh =
        video.videoHeight;


    if(
        !vw ||
        !vh
    ){

        return;
    }


    const cw =
        canvas.width;

    const ch =
        canvas.height;


    /* COVER */

    const scale =
        Math.max(
            cw / vw,
            ch / vh
        );


    const width =
        vw * scale;

    const height =
        vh * scale;


    const x =
        (cw - width) / 2;

    const y =
        (ch - height) / 2;


    /* CLEAR */

    ctx.clearRect(
        0,
        0,
        cw,
        ch
    );


    /* DRAW */

    ctx.drawImage(
        video,
        x,
        y,
        width,
        height
    );

}


/* =================================
   VIDEO SEEKED
================================= */

video.addEventListener(
    "seeked",
    function(){

        drawFrame();

    }
);


/* =================================
   UPDATE
================================= */

function update(){

    ticking = false;


    if(!ready){

        return;
    }


    /* =================================
       TOTAL SCROLL DISTANCE
    ================================= */

    const total =
        container.offsetHeight -
        window.innerHeight;


    /* =================================
       CURRENT SCROLL
    ================================= */

    let progress =
        window.scrollY / total;


    /* LIMIT 0 → 1 */

    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    /* =================================
       VIDEO TIME
    ================================= */

    const targetTime =
        progress *
        Math.max(
            0,
            duration - 0.05
        );


    /* =================================
       SEEK
    ================================= */

    if(
        Math.abs(
            targetTime -
            lastTime
        ) > 0.005
    ){

        lastTime =
            targetTime;

        video.currentTime =
            targetTime;
    }


    /* =================================
       FRAME NUMBER
    ================================= */

    const frame =
        Math.floor(
            targetTime * 30
        );


    frameText.textContent =
        String(frame)
        .padStart(
            4,
            "0"
        );


    /* =================================
       PERCENT
    ================================= */

    const percent =
        Math.floor(
            progress * 100
        );


    percentText.textContent =
        percent;


    /* =================================
       PROGRESS BAR
    ================================= */

    progressBar.style.width =
        percent + "%";


    /* =================================
       INTRO FADE
    ================================= */

    if(
        progress > 0.08
    ){

        intro.style.opacity =
            "0";

    }else{

        intro.style.opacity =
            String(
                1 -
                progress / 0.08
            );

    }


    /* =================================
       SOCIAL CARDS
    ================================= */

    cards.forEach(
        function(card){

            const start =
                parseFloat(
                    card.dataset.start
                );


            if(
                progress >= start
            ){

                card.classList.add(
                    "active"
                );

            }else{

                card.classList.remove(
                    "active"
                );

            }

        }
    );

}


/* =================================
   SCROLL EVENT
================================= */

window.addEventListener(
    "scroll",
    function(){

        if(!ticking){

            requestAnimationFrame(
                update
            );

            ticking = true;

        }

    },
    {
        passive:true
    }
);


/* =================================
   INITIALIZE
================================= */

video.load();

resizeCanvas();

</script>

</body>
</html>
