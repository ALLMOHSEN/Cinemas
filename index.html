<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ALMOHSEN</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;

    background: #000;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =====================================================
   SCROLL AREA
===================================================== */

.scroll-area {

    /*
       كلما زاد الرقم،
       يصبح التحكم بالفيديو أكثر دقة.
    */

    height: 700vh;

    position: relative;
}


/* =====================================================
   FIXED VIDEO SCREEN
===================================================== */

.video-screen {

    position: sticky;

    top: 0;

    width: 100%;

    height: 100vh;

    overflow: hidden;

    background: #000;
}


/* =====================================================
   VIDEO CANVAS
===================================================== */

#canvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    display: block;
}


/* =====================================================
   CINEMATIC DARK OVERLAY
===================================================== */

.cinematic-overlay {

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:

        linear-gradient(
            to bottom,
            rgba(0,0,0,.15),
            transparent 40%,
            rgba(0,0,0,.55)
        );

}


/* =====================================================
   RED SCI-FI LIGHT
===================================================== */

.red-glow {

    position: absolute;

    right: -15%;

    top: 0;

    width: 45%;

    height: 100%;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse,
            rgba(255,0,0,.15),
            transparent 65%
        );

    filter: blur(35px);

}


/* =====================================================
   HUD
===================================================== */

.hud {

    position: absolute;

    top: 25px;

    left: 25px;

    direction: ltr;

    font-family: monospace;

    font-size: 10px;

    letter-spacing: 2px;

    color:
        rgba(255,70,70,.8);

    text-shadow:
        0 0 10px
        rgba(255,0,0,.5);

    line-height: 1.8;

}


/* =====================================================
   INTRO
===================================================== */

.intro {

    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    pointer-events: none;

    transition:
        opacity .4s ease;
}


.intro h1 {

    font-size:
        clamp(55px, 13vw, 140px);

    font-weight: 800;

    letter-spacing: 6px;

    text-shadow:

        0 0 15px
        rgba(255,255,255,.4),

        0 0 40px
        rgba(255,0,0,.35);
}


.intro p {

    margin-top: 15px;

    font-size: 14px;

    letter-spacing: 4px;

    opacity: .65;
}


/* =====================================================
   SOCIAL PANEL
===================================================== */

.social-panel {

    position: absolute;

    right: 0;

    top: 50%;

    transform:
        translateY(-50%);

    width:
        min(430px, 92vw);

    padding: 15px;

    display: flex;

    flex-direction: column;

    gap: 13px;

}


/* =====================================================
   SOCIAL CARD
===================================================== */

.social {

    position: relative;

    display: flex;

    align-items: center;

    gap: 15px;

    min-height: 72px;

    padding: 15px 20px;

    text-decoration: none;

    color: white;

    border-radius:
        20px 0 0 20px;


    /*
       GLASS
    */

    background:

        linear-gradient(
            135deg,
            rgba(255,20,20,.35),
            rgba(50,0,0,.18)
        );


    border:
        1px solid
        rgba(255,80,80,.55);


    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);


    box-shadow:

        inset 0 0 30px
        rgba(255,0,0,.1),

        0 15px 40px
        rgba(0,0,0,.5),

        -5px 0 25px
        rgba(255,0,0,.15);


    /*
       يبدأ خارج الشاشة
    */

    opacity: 0;

    transform:
        translateX(120%);


    transition:

        opacity .55s ease,

        transform .8s
        cubic-bezier(
            .16,
            1,
            .3,
            1
        );


    overflow: hidden;
}


/* =====================================================
   RED EDGE
===================================================== */

.social::before {

    content: "";

    position: absolute;

    right: 0;

    top: 0;

    width: 4px;

    height: 100%;

    background:

        linear-gradient(
            to bottom,
            transparent,
            #ff1b1b,
            transparent
        );


    box-shadow:

        0 0 18px
        #ff0000;
}


/* =====================================================
   SCAN LIGHT
===================================================== */

.social::after {

    content: "";

    position: absolute;

    top: 0;

    left: -120%;

    width: 80%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.14),
            transparent
        );

    transform:
        skewX(-20deg);

    animation:
        scan 4s infinite;
}


@keyframes scan {

    0% {
        left: -120%;
    }

    30% {
        left: 140%;
    }

    100% {
        left: 140%;
    }

}


/* =====================================================
   SHOW SOCIAL
===================================================== */

.social.show {

    opacity: 1;

    transform:
        translateX(0);

}


/* =====================================================
   ICON
===================================================== */

.icon {

    width: 44px;

    height: 44px;

    min-width: 44px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 13px;

    background:

        rgba(255,0,0,.22);

    border:

        1px solid
        rgba(255,100,100,.45);

    font-size: 20px;

    box-shadow:

        inset 0 0 15px
        rgba(255,0,0,.15),

        0 0 18px
        rgba(255,0,0,.15);

}


/* =====================================================
   TEXT
===================================================== */

.social-info {

    display: flex;

    flex-direction: column;

    gap: 5px;

}


.social-name {

    font-size: 15px;

    font-weight: bold;

}


.social-user {

    font-size: 12px;

    opacity: .6;

    direction: ltr;

    text-align: right;

}


/* =====================================================
   SCROLL INDICATOR
===================================================== */

.scroll-indicator {

    position: absolute;

    bottom: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    text-align: center;

    font-size: 10px;

    letter-spacing: 4px;

    opacity: .7;

    transition:
        opacity .4s ease;

}


.scroll-indicator span {

    display: block;

    margin-top: 8px;

    font-size: 22px;

    animation:
        arrow 1.5s infinite;

}


@keyframes arrow {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(8px);
    }

}


/* =====================================================
   END
===================================================== */

.end {

    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #200000,
            #000 70%
        );

}


.end h2 {

    font-size:
        clamp(35px, 8vw, 80px);

    letter-spacing: 5px;

}


.end p {

    margin-top: 15px;

    opacity: .6;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    .social-panel {

        width: 94vw;

        padding: 8px;

        gap: 9px;

    }


    .social {

        min-height: 62px;

        padding: 11px 14px;

    }


    .icon {

        width: 38px;

        height: 38px;

        min-width: 38px;

    }


    .hud {

        top: 15px;

        left: 15px;

        font-size: 8px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     VIDEO SOURCE
===================================================== -->

<video
    id="video"
    src="12.mp4"
    preload="auto"
    muted
    playsinline
    webkit-playsinline
    style="display:none;">

</video>



<!-- =====================================================
     SCROLL AREA
===================================================== -->

<section
    class="scroll-area"
    id="scrollArea">


    <!-- =================================================
         STICKY SCREEN
    ================================================== -->

    <div class="video-screen">


        <!-- VIDEO -->

        <canvas
            id="canvas">
        </canvas>


        <!-- OVERLAY -->

        <div
            class="cinematic-overlay">
        </div>


        <div
            class="red-glow">
        </div>


        <!-- =================================================
             HUD
        ================================================== -->

        <div class="hud">

            <div>
                ALMOHSEN // SYSTEM
            </div>

            <div>
                VIDEO_12.MP4
            </div>

            <div id="frame">
                FRAME: 0000
            </div>

            <div id="progress">
                PROGRESS: 0%
            </div>

        </div>



        <!-- =================================================
             INTRO
        ================================================== -->

        <div
            class="intro"
            id="intro">

            <div>

                <h1>
                    ALMOHSEN
                </h1>

                <p>
                    SCROLL TO EXPLORE
                </p>

            </div>

        </div>



        <!-- =================================================
             SOCIAL MEDIA
        ================================================== -->

        <div class="social-panel">


            <!-- INSTAGRAM -->

            <a
                class="social"
                data-start="0.20"
                href="https://instagram.com/YOUR_USERNAME"
                target="_blank"
                rel="noopener">

                <div class="icon">
                    ◎
                </div>

                <div class="social-info">

                    <div class="social-name">
                        Instagram
                    </div>

                    <div class="social-user">
                        @YOUR_USERNAME
                    </div>

                </div>

            </a>



            <!-- TIKTOK -->

            <a
                class="social"
                data-start="0.38"
                href="https://tiktok.com/@YOUR_USERNAME"
                target="_blank"
                rel="noopener">

                <div class="icon">
                    ♪
                </div>

                <div class="social-info">

                    <div class="social-name">
                        TikTok
                    </div>

                    <div class="social-user">
                        @YOUR_USERNAME
                    </div>

                </div>

            </a>



            <!-- FACEBOOK -->

            <a
                class="social"
                data-start="0.56"
                href="https://facebook.com/YOUR_USERNAME"
                target="_blank"
                rel="noopener">

                <div class="icon">
                    f
                </div>

                <div class="social-info">

                    <div class="social-name">
                        Facebook
                    </div>

                    <div class="social-user">
                        YOUR_USERNAME
                    </div>

                </div>

            </a>



            <!-- YOUTUBE -->

            <a
                class="social"
                data-start="0.74"
                href="https://youtube.com/@YOUR_USERNAME"
                target="_blank"
                rel="noopener">

                <div class="icon">
                    ▶
                </div>

                <div class="social-info">

                    <div class="social-name">
                        YouTube
                    </div>

                    <div class="social-user">
                        @YOUR_USERNAME
                    </div>

                </div>

            </a>


        </div>



        <!-- =================================================
             SCROLL
        ================================================== -->

        <div
            class="scroll-indicator"
            id="scrollIndicator">

            SCROLL

            <span>
                ↓
            </span>

        </div>


    </div>

</section>



<!-- =====================================================
     END
===================================================== -->

<section class="end">

    <div>

        <h2>
            ALMOHSEN
        </h2>

        <p>
            Thank you for visiting
        </p>

    </div>

</section>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById(
        "video"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext("2d");

const scrollArea =
    document.getElementById(
        "scrollArea"
    );

const videoScreen =
    document.querySelector(
        ".video-screen"
    );

const intro =
    document.getElementById(
        "intro"
    );

const socials =
    document.querySelectorAll(
        ".social"
    );

const frame =
    document.getElementById(
        "frame"
    );

const progressText =
    document.getElementById(
        "progress"
    );

const scrollIndicator =
    document.getElementById(
        "scrollIndicator"
    );


/* =====================================================
   VARIABLES
===================================================== */

let ready = false;

let duration = 0;

let lastTime = -1;

let animation = false;


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.floor(
            window.innerWidth * dpr
        );


    canvas.height =
        Math.floor(
            window.innerHeight * dpr
        );


    canvas.style.width =
        window.innerWidth + "px";


    canvas.style.height =
        window.innerHeight + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    drawFrame();

}


/* =====================================================
   DRAW FRAME
===================================================== */

function drawFrame() {

    if (
        !ready ||
        !video.videoWidth
    ) {

        return;

    }


    const cw =
        window.innerWidth;

    const ch =
        window.innerHeight;


    const vw =
        video.videoWidth;

    const vh =
        video.videoHeight;


    /*
       COVER
    */

    const scale =
        Math.max(
            cw / vw,
            ch / vh
        );


    const width =
        vw * scale;


    const height =
        vh * scale;


    const x =
        (cw - width) / 2;


    const y =
        (ch - height) / 2;


    ctx.clearRect(
        0,
        0,
        cw,
        ch
    );


    ctx.drawImage(
        video,
        x,
        y,
        width,
        height
    );

}


/* =====================================================
   VIDEO READY
===================================================== */

function videoLoaded() {

    if (ready)
        return;


    if (!video.duration)
        return;


    duration =
        video.duration;


    ready =
        true;


    resizeCanvas();


    update();

}


/* =====================================================
   VIDEO EVENTS
===================================================== */

video.addEventListener(
    "loadedmetadata",
    videoLoaded
);

video.addEventListener(
    "loadeddata",
    videoLoaded
);

video.addEventListener(
    "canplay",
    videoLoaded
);

video.addEventListener(
    "seeked",
    drawFrame
);


/* =====================================================
   MAIN SCROLL
===================================================== */

function update() {

    animation = false;


    if (
        !ready ||
        duration <= 0
    ) {

        return;

    }


    /*
       مكان القسم بالنسبة للشاشة
    */

    const rect =
        scrollArea.getBoundingClientRect();


    /*
       مقدار Scroll داخل القسم
    */

    const maxScroll =
        scrollArea.offsetHeight -
        window.innerHeight;


    let p =
        -rect.top /
        maxScroll;


    /*
       0 → 1
    */

    p =
        Math.max(
            0,
            Math.min(
                1,
                p
            )
        );


    /* =================================================
       VIDEO FRAME
    ================================================= */

    const targetTime =
        p * duration;


    if (
        Math.abs(
            targetTime -
            lastTime
        ) > 0.012
    ) {

        lastTime =
            targetTime;


        video.currentTime =
            targetTime;

    }


    /* =================================================
       FRAME NUMBER
    ================================================= */

    /*
       الرقم تقريبي حسب 30FPS
    */

    const fps = 30;

    const currentFrame =
        Math.floor(
            targetTime * fps
        );


    frame.textContent =
        "FRAME: " +
        String(
            currentFrame
        ).padStart(
            4,
            "0"
        );


    /* =================================================
       PROGRESS
    ================================================= */

    progressText.textContent =
        "PROGRESS: " +
        Math.round(
            p * 100
        ) +
        "%";


    /* =================================================
       INTRO
    ================================================= */

    if (p < .15) {

        intro.style.opacity =
            String(
                1 -
                p / .15
            );

    }

    else {

        intro.style.opacity =
            "0";

    }


    /* =================================================
       SOCIALS
    ================================================= */

    socials.forEach(
        function(card) {

            const start =
                parseFloat(
                    card.dataset.start
                );


            if (p >= start) {

                card.classList.add(
                    "show"
                );

            }

            else {

                card.classList.remove(
                    "show"
                );

            }

        }
    );


    /* =================================================
       SCROLL INDICATOR
    ================================================= */

    if (p > .08) {

        scrollIndicator.style.opacity =
            "0";

    }

    else {

        scrollIndicator.style.opacity =
            ".7";

    }

}


/* =====================================================
   SCROLL EVENT
===================================================== */

window.addEventListener(
    "scroll",
    function() {

        if (!animation) {

            animation =
                requestAnimationFrame(
                    update
                );

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   ERROR
===================================================== */

video.addEventListener(
    "error",
    function() {

        console.error(
            "Cannot load 12.mp4"
        );

    }
);


/* =====================================================
   LOAD
===================================================== */

video.load();

</script>

</body>

</html>
